[project]
name = "leaf-project"
version = "0.1.0"
requires-python = ">=3.14.10"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
required-version = ">=0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["source", "tests"]

